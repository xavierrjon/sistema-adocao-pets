services:
  postgres:
    image: postgres:16-alpine
    container_name: adoteja-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-adoteja}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adoteja}
      POSTGRES_DB: ${POSTGRES_DB:-adoteja}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-adoteja} -d ${POSTGRES_DB:-adoteja}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
    name: adoteja_postgres_data