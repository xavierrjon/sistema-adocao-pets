name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npm run typecheck --workspace frontend

      - name: Build
        run: npm run build --workspace frontend

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Gerar cliente Prisma
        run: npm run prisma:generate --workspace backend

      - name: Validar schema do Prisma
        run: npm run prisma:validate --workspace backend
        env:
          # Valor placeholder: a validação do schema é offline e não conecta ao banco.
          DATABASE_URL: postgresql://usuario:senha@localhost:5432/banco?schema=public

      - name: Typecheck
        run: npm run typecheck --workspace backend

      - name: Build
        run: npm run build --workspace backend