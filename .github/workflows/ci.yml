name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

# O pipeline apenas lê o repositório.
permissions:
  contents: read

# Cancela execuções antigas da mesma branch quando uma nova é enviada.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npm run typecheck --workspace frontend

      - name: Testes
        run: npm run test --workspace frontend

      - name: Build
        run: npm run build --workspace frontend

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      FRONTEND_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Gerar cliente Prisma
        run: npm run prisma:generate --workspace backend

      - name: Validar schema do Prisma
        run: npm run prisma:validate --workspace backend
        env:
          # Valores placeholder: a validação do schema é offline e não conecta ao banco.
          DATABASE_URL: postgresql://usuario:senha@localhost:5432/banco?schema=public
          DIRECT_URL: postgresql://usuario:senha@localhost:5432/banco?schema=public

      - name: Typecheck
        run: npm run typecheck --workspace backend

      - name: Testes
        run: npm run test --workspace backend

      - name: Build
        run: npm run build --workspace backend
